server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Smaller downloads: the JavaScript, CSS and text files go out gzipped (HTML always does).
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml text/markdown text/plain application/xml;

  # Pages are checked with the server on every visit (a cheap 304 when unchanged), so a new deploy shows
  # at once; the files below are cached hard.
  add_header Cache-Control "no-cache";

  # The app's pages (keep in step with src/main.tsx).
  location = / {
    try_files /index.html =404;
  }
  location = /connect {
    try_files /index.html =404;
  }
  # Each page has its own HTML file with its own title and link-preview tags (see vite.config.ts).
  location = /hangout {
    try_files /hangout.html =404;
  }
  location ~ ^/docs/?$ {
    try_files /docs.html =404;
  }
  location ~ ^/games/?$ {  # every game, 20 a page (?page=2), searchable (?q=)
    try_files /games.html =404;
  }
  location ~ ^/creators/?$ {  # every game by independent creators
    try_files /creators.html =404;
  }
  # Approve links for games published through the API: /approve/<code>
  location ~ "^/approve/[A-Za-z0-9_-]{8,40}/?$" {  # quoted: nginx needs quotes around a { in a pattern
    try_files /approve.html =404;
  }
  # The docs as plain text, for AI tools: readable in the browser, not a download.
  location = /docs.md {
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    try_files $uri =404;
  }

  # Built files have a fingerprint in their name (a new build is a new name), so browsers keep them for a year.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # Pictures and the favicon change rarely: a week.
  location ~* \.(svg|jpg|jpeg|png|webp|ico)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # For search engines.
  location = /robots.txt {
    try_files $uri =404;
  }
  location = /sitemap.xml {
    try_files $uri =404;
  }

  # Real files (built assets, favicon). Anything else is a 404 ...
  location / {
    try_files $uri =404;
  }

  # ... answered with the app, which shows its "Page not found" screen, keeping the 404 status.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
