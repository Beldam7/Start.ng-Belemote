server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The app's pages (keep in step with HOME_PATHS and HANGOUT_PATH in src/main.tsx).
  location = / {
    try_files /index.html =404;
  }
  location = /connect {
    try_files /index.html =404;
  }
  location = /hangout {
    try_files /index.html =404;
  }

  # Real files (built assets, favicon). Anything else is a 404 ...
  location / {
    try_files $uri =404;
  }

  # ... answered with the app, which shows its "Page not found" screen, keeping the 404 status.
  error_page 404 /index.html;
}
