# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - prod
      - staging
      - dev
  path_filters:
    - '!**/package-lock.json'
    - '!dist/**'
    - '!public/**'
  path_instructions:
    - path: src/**
      instructions: >
        React 18 + TypeScript strict. Flag any use of `any`, unhandled promise rejections,
        missing loading/error states, stale-closure bugs in hooks, and accessibility problems.
        VITE_* variables are public; flag anything secret read from import.meta.env.
    - path: src/**/*.{tsx,css}
      instructions: >
        Styling must follow CONTRIBUTING.md: the new UI has to look like the rest of start.ng.
        Flag hard-coded hex or rgb colours (use the CSS variables in src/styles.css), a new CSS
        framework, UI library or font, new components that duplicate an existing one, colours
        with no dark-mode value, and layouts that break at phone width.
    - path: src/three/**
      instructions: >
        three.js code. Flag undisposed geometries, materials, textures and renderers,
        and event listeners or animation loops that are not cleaned up.
    - path: worker/**
      instructions: >
        Cloudflare Worker. Flag unvalidated request input, missing auth checks,
        secrets in code, and missing tests for new behaviour.
    - path: .github/workflows/**
      instructions: >
        Actions must be pinned to a full commit SHA, use least-privilege `permissions`,
        and never interpolate untrusted `github.event.*` values directly into `run:` scripts.
    - path: Dockerfile
      instructions: >
        The malware-scan stage must stay before `npm ci`. Flag anything that weakens it.
chat:
  auto_reply: true
